[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regen-sensor-sdk"
version = "0.0.0"
description = "Universal ingestion layer for the Regen Network Claims Engine. Wraps real-world evidence sources (transcripts, sensors, feeds) as Output Records the Claims Engine can consume."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Regen Network Development, PBC" },
]
keywords = ["regen-network", "claims-engine", "sensors", "evidence", "ingestion", "ecology", "ecocredits"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/regen-network/sensor-sdk"
Repository = "https://github.com/regen-network/sensor-sdk"
Issues = "https://github.com/regen-network/sensor-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/regen_sensor_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
